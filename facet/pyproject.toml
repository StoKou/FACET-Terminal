[project]
name = "facet-terminal"
version = "0.1.0"
description = "FACET-Terminal task generation pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "litellm>=1.89.0,<1.90.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
